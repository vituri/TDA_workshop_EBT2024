# rebuild.yml — Bit-rot detection for the TDA Workshop Quarto book
#
# Purpose: Rebuild the book against the *current main branches* of all six
# JuliaTDA ecosystem packages so that API-breaking changes are caught before
# they silently corrupt the published book.
#
# Triggers:
#   - workflow_dispatch : run on demand at any time
#   - schedule          : every Monday at 03:00 UTC (quiet off-peak time)
#
# Design notes:
#   • The pinned Manifest.toml is deleted before `Pkg.develop` so that Julia
#     resolves fresh dependencies against the latest main-branch source trees.
#   • wings2.qmd uses GLMakie (requires a display); all other chapters use
#     CairoMakie.  xvfb-run wraps the quarto render step to satisfy GLMakie.
#   • `freeze: true` is set in _quarto.yml, but the CI intentionally deletes
#     the _freeze directory so every chapter is re-executed from scratch.
#   • A failed run signals bit-rot: something in a JuliaTDA package main
#     branch broke the book.  Check the Actions log for the specific error.
#   • The first scheduled run is the real integration test — no local full
#     render is attempted in this file (render time >> 10 min on cold cache).

name: Rebuild (bit-rot detection)

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: '0 3 * * 1'

jobs:
  rebuild:
    name: Rebuild book against JuliaTDA main branches
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout the workshop repository
      # ------------------------------------------------------------------ #
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # 2. Set up Julia
      #    No [compat] entry in Project.toml → use latest stable 1.x.
      # ------------------------------------------------------------------ #
      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      # ------------------------------------------------------------------ #
      # 3. Restore/save the Julia package cache
      # ------------------------------------------------------------------ #
      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      # ------------------------------------------------------------------ #
      # 4. Set up Quarto
      # ------------------------------------------------------------------ #
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # ------------------------------------------------------------------ #
      # 5. Install system dependencies for xvfb (needed by GLMakie in
      #    wings2.qmd) and OpenGL libraries required by GLMakie on Linux.
      # ------------------------------------------------------------------ #
      - name: Install display / OpenGL deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgl1-mesa-glx \
            libgl1-mesa-dri \
            libglu1-mesa \
            xauth

      # ------------------------------------------------------------------ #
      # 6. Develop the six JuliaTDA packages from their GitHub main branches,
      #    overriding the pinned Manifest.toml.
      #
      #    Strategy:
      #      a) Delete Manifest.toml so no pinned revisions constrain the
      #         solver.
      #      b) Pkg.develop all six packages from their GitHub URLs (this
      #         clones main and adds them as dev dependencies).
      #      c) Pkg.instantiate to resolve and precompile everything.
      #
      #    Pattern copied from JuliaTDA/JuliaTDA.jl's CI.yml.
      # ------------------------------------------------------------------ #
      - name: Develop JuliaTDA ecosystem packages from main
        run: |
          rm -f Manifest.toml
          julia --project=. -e '
            using Pkg
            Pkg.develop([
              PackageSpec(url = "https://github.com/JuliaTDA/MetricSpaces.jl"),
              PackageSpec(url = "https://github.com/JuliaTDA/TDAmapper.jl"),
              PackageSpec(url = "https://github.com/JuliaTDA/TDAplots.jl"),
              PackageSpec(url = "https://github.com/JuliaTDA/Ripserer.jl"),
              PackageSpec(url = "https://github.com/JuliaTDA/PersistenceDiagrams.jl"),
              PackageSpec(url = "https://github.com/JuliaTDA/ToMATo.jl"),
            ])
            Pkg.instantiate()'

      # ------------------------------------------------------------------ #
      # 7. Install the IJulia kernel so Quarto can execute Julia notebooks.
      #    We also pre-install the kernel for the version Quarto will look
      #    for (julia-1.10 is the kernel name used in the qmd frontmatter,
      #    but the actual Julia binary is whatever setup-julia installed).
      # ------------------------------------------------------------------ #
      - name: Register IJulia kernel
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.add("IJulia")
            using IJulia
            IJulia.installkernel("julia-1.10", "--project=$(pwd())")'

      # ------------------------------------------------------------------ #
      # 8. Clear the freeze cache so every chapter is re-executed (that is
      #    the whole point of this workflow).
      # ------------------------------------------------------------------ #
      - name: Clear Quarto freeze cache
        run: rm -rf _freeze

      # ------------------------------------------------------------------ #
      # 9. Render the book.
      #    xvfb-run is required because wings2.qmd uses GLMakie, which needs
      #    a virtual framebuffer on headless Linux runners.
      #    Render output goes to docs/ (as configured in _quarto.yml) but is
      #    NOT published — a failed render is the bit-rot signal.
      # ------------------------------------------------------------------ #
      - name: Render book (xvfb for GLMakie)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" quarto render
